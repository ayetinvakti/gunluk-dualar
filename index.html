    <script>
        // Tema ve özel renk paleti (titremeyi önlemek için en başta çalışır; tema sınıfı yalnızca <html> üzerinde)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
                d.classList.add('light-mode');
            }
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }
            // Tarayıcı çubuğu rengi sayfa zeminine uysun
            const metaTC = document.querySelector('meta[name="theme-color"]');
            if (metaTC) metaTC.setAttribute('content', b || (d.classList.contains('light-mode') ? '#f1f5f9' : '#0f172a'));

            // Dil ve yön (RTL titremesini önlemek için)
            const lang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            d.setAttribute('lang', lang);
        })();
    </script>

    function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderKategoriler() {
        const box = document.getElementById('category-filters');
        box.innerHTML = kategoriler.map(k =>
            `<button class="cat-btn ${k.id === aktifKategori ? 'active' : ''}" onclick="filterCategory('${k.id}')">${t[k.key]}</button>`
        ).join('');
    }

    let hafiz = [];
    try { hafiz = JSON.parse(localStorage.getItem('dua_hafiz')) || []; } catch (e) {}
    let repeatOn = localStorage.getItem('dua_repeat') !== '0';
    let cur = null;
    const ezberLvl = {};

    function updateTools() {
        document.getElementById('rep-btn').innerText = repeatOn ? t.repeat_on : t.repeat_off;
        document.getElementById('hafiz-count').innerText = `${t.hafiz_count}: ${hafiz.length}/${dualarVeritabani.length}`;
        document.getElementById('tts-note').innerText = t.tts_note;
    }
    function toggleRepeat() {
        repeatOn = !repeatOn;
        try { localStorage.setItem('dua_repeat', repeatOn ? '1' : '0'); } catch (e) {}
        updateTools();
    }

    function phrases(txt) { return escapeHtml(txt).replace(/([,.;])\s+/g, '$1<br>'); }

    function renderDualar() {
        stopAll();
        updateTools();
        if ('speechSynthesis' in window) speechSynthesis.getVoices();
        const container = document.getElementById('dualar-container');
        const q = (document.getElementById('search-input').value || '').trim().toLocaleLowerCase('tr');

        const filtrelenmis = dualarVeritabani.filter(d => {
            if (aktifKategori === 'ezber') { if (!hafiz.includes(d.id)) return false; }
            else if (aktifKategori !== 'hepsi' && d.kategori !== aktifKategori) return false;
            if (!q) return true;
            return (d.baslik + ' ' + d.okunus + ' ' + d.meal + ' ' + d.fazilet).toLocaleLowerCase('tr').includes(q)
                || d.arapca.includes(q);
        });

        if (filtrelenmis.length === 0) {
            container.innerHTML = `<div class="empty-msg">${t.empty}</div>`;
            return;
        }

        container.innerHTML = filtrelenmis.map(dua => `
            <div class="dua-card" id="dua-${dua.id}" data-ez="${ezberLvl[dua.id] || 0}">
                <div class="dua-header">
                    <div class="dua-name">${escapeHtml(dua.baslik)}</div>
                    <div class="dua-tag">${t[kategoriKey[dua.kategori]]}</div>
                </div>
                <div class="arabic-text ezb-a" lang="ar" onclick="this.classList.toggle('shown')">${dua.arapca}</div>
                <div class="pronunciation-text ezb-p" onclick="this.classList.toggle('shown')">🔊 ${t.pron}: ${phrases(dua.okunus)}</div>
                <div class="translation-text"><strong>${t.meaning}:</strong> ${escapeHtml(dua.meal)}</div>
                <div class="dua-virtue">✨ <strong>${t.virtue}:</strong> ${escapeHtml(dua.fazilet)}</div>
                ${dua.partial ? `<div class="mini-note">ℹ️ ${t.partial_note}</div>` : ''}
                <div class="dua-actions">
                    <button class="copy-btn play-btn" onclick="playDua(${dua.id}, this)">🔊 ${t.listen}</button>
                    <button class="copy-btn" onclick="cycleEzber(${dua.id}, this)">🧠 ${[t.ezber, t.ezber1, t.ezber2][ezberLvl[dua.id] || 0]}</button>
                    <button class="copy-btn ${hafiz.includes(dua.id) ? 'on' : ''}" onclick="toggleHafiz(${dua.id}, this)">${hafiz.includes(dua.id) ? '✅ ' + t.hafiz_done : '☐ ' + t.hafiz}</button>
                    <button class="copy-btn" onclick="copyDua(${dua.id}, this)">📋 ${t.copy}</button>
                </div>
            </div>
        `).join('');
    }

    function cycleEzber(id, btn) {
        const lvl = ((ezberLvl[id] || 0) + 1) % 3;
        ezberLvl[id] = lvl;
        const card = document.getElementById('dua-' + id);
        card.dataset.ez = lvl;
        card.querySelectorAll('.shown').forEach(e => e.classList.remove('shown'));
        btn.innerText = '🧠 ' + [t.ezber, t.ezber1, t.ezber2][lvl];
    }

    function toggleHafiz(id, btn) {
        const i = hafiz.indexOf(id);
        if (i > -1) hafiz.splice(i, 1); else hafiz.push(id);
        try { localStorage.setItem('dua_hafiz', JSON.stringify(hafiz)); } catch (e) {}
        if (aktifKategori === 'ezber') { renderDualar(); return; }
        btn.classList.toggle('on', hafiz.includes(id));
        btn.innerText = hafiz.includes(id) ? '✅ ' + t.hafiz_done : '☐ ' + t.hafiz;
        updateTools();
    }

    function stopAll() {
        if (cur) { cur.stopped = true; if (cur.audio) { cur.audio.pause(); cur.audio.src = ''; } cur = null; }
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        document.querySelectorAll('.play-btn').forEach(b => { b.innerText = '🔊 ' + t.listen; });
    }

    function playDua(id, btn) {
        if (cur && cur.id === id) { stopAll(); return; }
        stopAll();
        const d = dualarVeritabani.find(x => x.id === id);
        if (!d) return;
        const ctl = { id, stopped: false, audio: null };
        cur = ctl;
        let rounds = repeatOn ? 3 : 1;
        btn.innerText = '⏹ ' + t.stop;

        const fail = () => {
            if (ctl.stopped) return;
            stopAll();
            btn.innerText = '⚠️ ' + t.audio_fail;
            setTimeout(() => { btn.innerText = '🔊 ' + t.listen; }, 2200);
        };
        const done = () => {
            if (ctl.stopped) return;
            if (--rounds > 0) setTimeout(() => { if (!ctl.stopped) round(); }, 1500);
            else stopAll();
        };
        const round = () => {
            if (d.sura) {
                const urls = [];
                for (let a = d.ayah; a <= (d.ayahEnd || d.ayah); a++) {
                    urls.push(`https://everyayah.com/data/Alafasy_128kbps/${String(d.sura).padStart(3, '0')}${String(a).padStart(3, '0')}.mp3`);
                }
                let i = 0;
                const next = () => {
                    const au = new Audio(urls[i]);
                    ctl.audio = au;
                    au.onerror = fail;
                    au.onended = () => { if (ctl.stopped) return; if (++i < urls.length) next(); else done(); };
                    au.play().catch(fail);
                };
                next();
            } else {
                if (!('speechSynthesis' in window)) return fail();
                const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith('ar'));
                if (!v) return fail();
                const u = new SpeechSynthesisUtterance(d.arapca);
                u.voice = v; u.lang = v.lang; u.rate = 0.7;
                u.onend = done;
                u.onerror = e => { if (e.error !== 'canceled' && e.error !== 'interrupted') fail(); };
                speechSynthesis.speak(u);
            }
        };
        round();
    }

    function filterCategory(kategori) {
        aktifKategori = kategori;
        renderKategoriler();
        renderDualar();
    }

    function copyDua(id, btn) {
        const d = dualarVeritabani.find(x => x.id === id);
        if (!d) return;
        const text = `${d.baslik}\n\n${d.arapca}\n\n${d.okunus}\n\n${d.meal}\n\n— Ayetin Vakti`;

        const done = () => {
            btn.innerHTML = '✅ ' + t.copied;
            setTimeout(() => { btn.innerHTML = '📋 ' + t.copy; }, 1800);
        };
        const fallback = () => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(ta);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(fallback);
        } else {
            fallback();
        }
    }

    // --- TEMA YÖNETİMİ (standart: tema sınıfı yalnızca <html> üzerinde) ---
    function syncThemeBtn() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.innerHTML = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    // Tarayıcı çubuğu rengini (theme-color) o anki arka plan rengine eşitler
    function updateThemeColor() {
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        const m = document.querySelector('meta[name="theme-color"]');
        if (m && bg) m.setAttribute('content', bg);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        syncThemeBtn();
        updateThemeColor();
    }

    window.onload = () => {
        syncThemeBtn();
        updateThemeColor();

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.placeholder = t[key];
        });

        renderKategoriler();
        renderDualar();
    };
</script>
</body>
</html>
