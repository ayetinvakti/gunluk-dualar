    <script>
        // Tema ve özel renk paleti (titremeyi önlemek için en başta çalışır; tema sınıfı yalnızca <html> üzerinde)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
                d.classList.add('light-mode');
            }
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }
            // Tarayıcı çubuğu rengi sayfa zeminine uysun
            const metaTC = document.querySelector('meta[name="theme-color"]');
            if (metaTC) metaTC.setAttribute('content', b || (d.classList.contains('light-mode') ? '#f1f5f9' : '#0f172a'));

            // Dil ve yön (RTL titremesini önlemek için)
            const lang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            d.setAttribute('lang', lang);
        })();
    </script>

            arapca: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
            okunus: "Hasbünallâhü ve ni'mel-vekîl.",
            meal: "Allah bize yeter, O ne güzel vekildir.",
            fazilet: "Âl-i İmrân Suresi 173. ayettir; Hz. İbrahim (a.s.) ateşe atıldığında bu sözü söylemiştir. (Buhârî)"
        },
        {
            id: 12,
            kategori: "sikinti",
            baslik: "Dünya ve Âhiret İyiliği Duası",
            arapca: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
            okunus: "Rabbenâ âtinâ fid-dünyâ haseneten ve fîl-âhirati haseneten ve kınâ azâben-nâr.",
            meal: "Rabbimiz! Bize dünyada da iyilik ver, âhirette de iyilik ver ve bizi ateşin azabından koru.",
            fazilet: "Bakara Suresi 201. ayettir; Peygamberimizin (s.a.s.) en çok yaptığı dualardan biridir. (Buhârî, Müslim)"
        }
    ];

    function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderKategoriler() {
        const box = document.getElementById('category-filters');
        box.innerHTML = kategoriler.map(k =>
            `<button class="cat-btn ${k.id === aktifKategori ? 'active' : ''}" onclick="filterCategory('${k.id}')">${t[k.key]}</button>`
        ).join('');
    }

    function renderDualar() {
        const container = document.getElementById('dualar-container');
        const q = (document.getElementById('search-input').value || '').trim().toLocaleLowerCase('tr');

        const filtrelenmis = dualarVeritabani.filter(d => {
            if (aktifKategori !== 'hepsi' && d.kategori !== aktifKategori) return false;
            if (!q) return true;
            return (d.baslik + ' ' + d.okunus + ' ' + d.meal + ' ' + d.fazilet).toLocaleLowerCase('tr').includes(q)
                || d.arapca.includes(q);
        });

        if (filtrelenmis.length === 0) {
            container.innerHTML = `<div class="empty-msg">${t.empty}</div>`;
            return;
        }

        container.innerHTML = filtrelenmis.map(dua => `
            <div class="dua-card">
                <div class="dua-header">
                    <div class="dua-name">${escapeHtml(dua.baslik)}</div>
                    <div class="dua-tag">${t[kategoriKey[dua.kategori]]}</div>
                </div>
                <div class="arabic-text" lang="ar">${dua.arapca}</div>
                <div class="pronunciation-text">🔊 ${t.pron}: ${escapeHtml(dua.okunus)}</div>
                <div class="translation-text"><strong>${t.meaning}:</strong> ${escapeHtml(dua.meal)}</div>
                <div class="dua-virtue">✨ <strong>${t.virtue}:</strong> ${escapeHtml(dua.fazilet)}</div>
                <div class="dua-actions">
                    <button class="copy-btn" onclick="copyDua(${dua.id}, this)">📋 ${t.copy}</button>
                </div>
            </div>
        `).join('');
    }

    function filterCategory(kategori) {
        aktifKategori = kategori;
        renderKategoriler();
        renderDualar();
    }

    function copyDua(id, btn) {
        const d = dualarVeritabani.find(x => x.id === id);
        if (!d) return;
        const text = `${d.baslik}\n\n${d.arapca}\n\n${d.okunus}\n\n${d.meal}\n\n— Ayetin Vakti`;

        const done = () => {
            btn.innerHTML = '✅ ' + t.copied;
            setTimeout(() => { btn.innerHTML = '📋 ' + t.copy; }, 1800);
        };
        const fallback = () => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(ta);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(fallback);
        } else {
            fallback();
        }
    }

    // --- TEMA YÖNETİMİ (standart: tema sınıfı yalnızca <html> üzerinde) ---
    function syncThemeBtn() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.innerHTML = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    // Tarayıcı çubuğu rengini (theme-color) o anki arka plan rengine eşitler
    function updateThemeColor() {
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        const m = document.querySelector('meta[name="theme-color"]');
        if (m && bg) m.setAttribute('content', bg);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        syncThemeBtn();
        updateThemeColor();
    }

    window.onload = () => {
        syncThemeBtn();
        updateThemeColor();

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.placeholder = t[key];
        });

        renderKategoriler();
        renderDualar();
    };
</script>
</body>
</html>
